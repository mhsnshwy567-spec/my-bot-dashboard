<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #1e1e2e; color: #fff; padding: 10px; margin: 0; }
        .container { display: flex; flex-direction: column; gap: 15px; }
        .sidebar, .editor-section, .chat-section { background: #2b2b3d; padding: 15px; border-radius: 10px; }
        textarea { width: 95%; height: 180px; background: #181825; color: #a6e3a1; border: 1px solid #45475a; border-radius: 5px; padding: 10px; font-family: monospace; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; margin-top: 5px; width: 100%; }
        input { width: 95%; padding: 8px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #45475a; background: #181825; color: #fff; }
        .chat-box { height: 100px; overflow-y: auto; background: #181825; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>🚀 لوحة تحكم البوتات (الجوال)</h2>

<div class="container">
    <div class="sidebar">
        <h3>🤖 قائمة البوتات</h3>
        <input type="text" id="botName" placeholder="اسم البوت">
        <button onclick="saveBot()">➕ حفظ البوت</button>
    </div>

    <div class="editor-section">
        <h3>📜 السكربت</h3>
        <textarea id="scriptEditor" placeholder="الكود هنا..."></textarea>
        <input type="text" id="errorLog" placeholder="ضع الخطأ (Error Log) هنا...">
    </div>

    <div class="chat-section">
        <h3>🤖 الذكاء الاصطناعي</h3>
        <div class="chat-box" id="chatBox">اكتب طلبك لتعديل أو إصلاح البوت...</div>
        <input type="text" id="userPrompt" placeholder="أطلب تعديل...">
        <button onclick="sendToAI()">⚡ تعديل الكود</button>
    </div>
</div>

<script>
    let activeBot = "";

    function saveBot() {
        let name = document.getElementById("botName").value || activeBot;
        let script = document.getElementById("scriptEditor").value;
        if(!name) return alert("ادخل اسم البوت!");

        fetch("/api/save_bot", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name: name, script: script})
        }).then(r => r.json()).then(data => {
            alert(data.message);
        });
    }

    function sendToAI() {
        let prompt = document.getElementById("userPrompt").value;
        let script = document.getElementById("scriptEditor").value;
        let error = document.getElementById("errorLog").value;
        let chatBox = document.getElementById("chatBox");

        chatBox.innerHTML += `<div><b>أنت:</b> ${prompt}</div>`;

        fetch("/api/ai_fix", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({prompt: prompt, script: script, error_log: error})
        }).then(r => r.json()).then(data => {
            if(data.status === "success") {
                chatBox.innerHTML += `<div style="color: #a6e3a1;"><b>AI:</b> تم التعديل!</div>`;
                document.getElementById("scriptEditor").value = data.ai_response;
            } else {
                alert("خطأ: " + data.message);
            }
        });
    }
</script>

</body>
</html>
